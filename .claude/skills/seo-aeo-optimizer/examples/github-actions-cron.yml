# Copy this to .github/workflows/seo-aeo-cron.yml in the target app repo.
# Adjust pnpm/npm/yarn invocations to match the app's package manager.

name: SEO AEO Optimizer — Weekly Audit

on:
  schedule:
    - cron: "17 3 * * 1"  # Every Monday at 03:17 UTC
  workflow_dispatch:        # Allow manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-aeo-cron
  cancel-in-progress: true

jobs:
  seo-aeo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Adjust the next two steps for your package manager
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'  # change to 'pnpm' or 'yarn' if applicable

      - name: Install dependencies
        run: npm ci  # or: pnpm install --frozen-lockfile / yarn install --frozen-lockfile

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Start local server (background)
        run: |
          npm run start &
          sleep 5
          curl -fsSL http://localhost:3000/ > /dev/null || (echo "App did not start"; exit 1)
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run SEO audit
        run: npm run seo:audit -- --url http://localhost:3000 --history

      - name: Score pages
        run: npm run seo:score -- --write

      - name: Validate metadata, schema, sitemap, robots
        run: npm run seo:validate
        env:
          # Validators that need a base URL pick this up
          SEO_BASE_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: npm run seo:lighthouse
        env:
          LHCI_URL: http://localhost:3000

      - name: Create optimization PR
        if: success()
        run: npm run seo:pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload audit artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_id }}
          path: |
            docs/seo/
            .lighthouseci/
          retention-days: 14
